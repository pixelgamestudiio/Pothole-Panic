<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Little auto. Big city. Bad roads. Dodge potholes, pick up passengers, and honk your way to a high score.">
  <meta name="theme-color" content="#102d29">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pothole Panic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pothole Panic — Chalo!</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#102d29;overscroll-behavior:none;touch-action:none">
  <div id="loading" style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#fff1cd;font:700 18px sans-serif;letter-spacing:3px">
    <div style="color:#ffc83d;font-size:32px;margin-bottom:12px">POTHOLE PANIC</div>
    <div style="font-size:11px;opacity:.65">WARMING UP THE AUTO…</div>
  </div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
